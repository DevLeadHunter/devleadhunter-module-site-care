name: 🧪 Tests (API)

# The module runs on the core: its tests run from the core's api/ (branch main), on the core's fixtures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the module
        uses: actions/checkout@v6
        with:
          path: module

      - name: 📥 Checkout the core (api/)
        uses: actions/checkout@v6
        with:
          repository: DevLeadHunter/devleadhunter
          path: core
          sparse-checkout: |
            api
          lfs: false

      # 3.11 = the production VPS's Python.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/api/requirements.txt

      - name: 📦 Install the core's dependencies and the module
        run: |
          python -m pip install --upgrade pip
          pip install -r core/api/requirements.txt
          pip install -e module/api

      - name: 🧹 Ruff
        working-directory: module/api
        run: ruff check . && ruff format --check .

      - name: 🧪 Pytest
        working-directory: core/api
        env:
          R2_PUBLIC_BASE_URL_DEV: https://media.example.com
        run: python -m pytest ../../module/api/tests -q -p no:cacheprovider
